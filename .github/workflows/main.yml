name: Compilar Mod Among Us

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Configurar .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Restaurar e Compilar Plugin
      run: dotnet build MeuModBR.csproj -c Release -o ./output
    - name: Salvar Arquivo DLL Pronto
      uses: actions/upload-artifact@v4
      with:
        name: MeuModBR-Plugin
        path: ./output/MeuModBR.dll
